{% extends 'control_nino/layout/base_control_nino.html' %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <i class="bi bi-exclamation-octagon text-danger display-1 mb-4"></i>
                    <h2 class="fw-bold mb-3">¿Eliminar registro?</h2>
                    <p class="text-muted mb-4">
                        Vas a eliminar el registro de <strong>"{{ nino.nombre }}"</strong> ({{ nino.tiempo }} min).
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">Sí, eliminar</button>
                            <a href="{% url 'control_nino:lista_control_ninos' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
