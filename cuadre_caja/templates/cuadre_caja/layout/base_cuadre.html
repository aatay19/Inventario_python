{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cuadre de Caja{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --cc-primary: #0f766e;
            --cc-primary-dark: #115e59;
            --cc-bg: #f1f5f9;
        }

        body {
            background: var(--cc-bg);
            color: #0f172a;
            min-height: 100vh;
        }

        .cc-navbar {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
        }

        .cc-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
        }

        .cc-title {
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .cc-chip {
            border-radius: 999px;
            padding: .45rem .9rem;
            font-size: .85rem;
            font-weight: 600;
        }

        .caja-numero {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #0f766e;
            background: #ccfbf1;
            flex-shrink: 0;
        }

        .caja-card {
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .caja-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, .10);
        }

        .table thead th {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #64748b;
            font-weight: 700;
            white-space: nowrap;
        }

        .monto {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .stat-valor {
            font-size: 1.35rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #64748b;
            font-weight: 700;
        }

        .dep-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: #e2e8f0;
            color: #334155;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
            }

            .cc-navbar {
                display: none !important;
            }

            .cc-card {
                box-shadow: none;
                border: 1px solid #dee2e6;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark cc-navbar shadow-sm no-print">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
                href="{% url 'cuadre_caja:index' %}">
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-white bg-opacity-25"
                    style="width: 38px; height: 38px;">
                    <i class="bi bi-cash-stack"></i>
                </span>
                Cuadre de Caja
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'cuadre_caja:historial' %}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-clock-history me-1"></i> Historial
                </a>
                <a href="{% url 'cuadre_caja:reportes' %}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-bar-chart-line me-1"></i> Reportes
                </a>

                <div class="dropdown">
                    <button class="btn btn-sm btn-light dropdown-toggle" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>
                        {{ request.user.first_name|default:request.user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        {% if messages %}
        {% for message in messages %}
        Swal.fire({
            title: "{% if message.tags == 'success' %}¡Listo!{% elif message.tags == 'error' %}Error{% else %}Información{% endif %}",
            text: "{{ message|escapejs }}",
            icon: "{% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",
            confirmButtonText: 'Aceptar',
            confirmButtonColor: '#0f766e',
            timer: 4000
        });
        {% endfor %}
        {% endif %}
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
